# ═══ 萤火虫输入法 · 配置 ═══
# 改完保存即时生效，不用重启
# 以 # 开头的都是说明

mode = "mixed"  # 五笔优先，想不起编码时用拼音兜底。
[wubi]
auto_commit = true  # 打满四码且唯一时直接上屏
auto_phrase = false  # 纯五笔模式下连续上屏 2–4 个单字（间隔小于 2 秒、中间没有标点），同样的组合出现 3 次后收进用户词库；默认关闭
z_key = "wildcard"  # 万能键可代替想不起的五笔编码；也可关闭

[pinyin]
fuzzy = false  # 支持 zh/z、ch/c、sh/s、n/l 的基础模糊音
scheme = "full"  # 全拼，或小鹤双拼（两键一个音节）；双拼只在「拼音」模式下生效，混输模式仍按全拼兜底

[dict]
extended = false  # 加载随包提供的扩展码表（约 33.7 万五笔词组、5 万拼音词）；默认关闭。开启后常驻内存约增加 25 MiB，在下一次空闲按键时切换，不打断当前组合

[candidate]
count = 7  # 每页候选数（3–9）
page_with_comma = true  # 组合态下用 , / . 翻页（对齐搜狗/微信）
select_with_semicolon = true  # 组合态下 ; 选第二候选；纯五笔模式下 ' 选第三候选（混输/拼音下 ' 仍是音节分隔符）
pick_char_with_brackets = true  # 组合态下 [ 取首选词的第一个字、] 取最后一个字；首选是单字时仍输出标点
show_wubi_learning = true  # 按需显示当前候选的完整五笔码与已核验拆字；不随输入模式自动开关
hint_wubi_code = true  # 混输模式下用拼音打出字词后，在光标旁短暂提示它的五笔码，帮助下次直接用五笔

[practice]
collect_weak_chars = false  # 混输模式下把靠拼音打出的单字记到本机 weak-chars.tsv，练习「完整码」时多出这些字；不上传、不影响候选排序，重置练习进度时一并清空
staged_unlock = true  # 前一题型练满 30 字（题库不足 30 时按题库数）且正确率 ≥90% 后解锁下一题型；已有练习记录的题型不会回锁。默认开启

[appearance]
theme = "light"  # 跟随系统外观，或固定使用浅色、深色主题

[hotkey]
toggle_wubi_learning = "alt+l"  # 切换同一学习区显示偏好，不提交当前组合；默认 alt+l（Option 前缀表示「开关」），留空 = 关闭
toggle_mode = "alt+m"  # 循环切换 混合 → 五笔 → 拼音；默认 alt+m（Option = 可选项），留空 = 关闭
toggle_english = "shift"  # shift = 单独按 Shift（对齐搜狗/微信） | 组合键如 ctrl+alt+e | none = 关闭
toggle_width = "alt+f"  # 组合键如 alt+f（默认，F = Full-width；⌥Space 与 ChatGPT 等应用冲突） | none = 关闭
toggle_punctuation = "alt+p"  # 组合键如 alt+p（默认，P = 标点；⌥. 会让出 ≥ 符号） | none = 关闭
toggle_variant = "alt+t"  # 组合键如 alt+t（默认，T = 繁体） | none = 关闭
open_settings = "alt+,"  # 组合键如 alt+,（默认，与其它状态键统一 Option 前缀） | none = 关闭；与菜单项的快捷键提示同源
open_update = "alt+g"  # 组合键如 alt+g（默认，G = GitHub 更新源） | none = 关闭；与菜单项「检查更新…」的快捷键提示同源
open_about = "alt+a"  # 组合键如 alt+a（默认，A = About） | none = 关闭；与菜单项的快捷键提示同源
open_practice = "alt+k"  # 组合键如 alt+k（默认，K = 练习） | none = 关闭；打开离线练习窗口
open_symbols = "alt+s"  # 打开符号 / emoji 选择面板（分类与中英文搜索）；默认 alt+s，留空 = 关闭。反引号 ` 可在候选窗中快速打开分类

[input]
punctuation = "chinese"  # 选择中文或英文标点；快捷键切换会保存此偏好
full_width = "half"  # 选择半角或全角 ASCII；全/半角快捷键切换会保存此偏好（旧版布尔值读取时自动迁移）
chinese_variant = "simplified"  # 选择简体或繁体输出；快捷键切换会保存此偏好
digit_punctuation = true  # 数字后紧跟的 . 和 : 不转成中文标点，便于输入小数、版本号与时间（如 3.14、12:30）
remember_english_per_app = true  # 在某个应用里切到英文后，回到该应用时保持英文；只记在内存里，退出输入法即清空

[update]
feed_url = ""  # 留空使用官方 GitHub 发布源；也可填自建 https appcast 地址。只由独立更新程序读取，输入法与核心不联网。
feed_mirrors = ""  # 按顺序尝试的备用 appcast 地址（逗号或换行分隔，最多 8 个 https）；默认源不可达时自动回退。只由独立更新程序读取。
