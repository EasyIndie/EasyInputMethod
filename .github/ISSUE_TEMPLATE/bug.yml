name: Bug
description: 报告一个缺陷
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: 现象
      description: 发生了什么？期望是什么？
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 环境
      description: 产品版本/build、安装来源、系统/架构、目标应用版本及输入模式（mixed·wubi·pinyin）；不清楚的字段可写未知
      placeholder: macOS 15.0, v0.1.0, mode=mixed
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志 / 截图
      description: 只附可公开的最小样例与诊断信息，不附真实聊天或完整个人词库。
  - type: markdown
    attributes:
      value: |
        ⚠️ 安全问题请勿在此公开，请走 `SECURITY.md` 的私下渠道。
