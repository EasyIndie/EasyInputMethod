name: Isolated IMK Notarization
on:
  workflow_dispatch:
    inputs:
      target_root:
        description: Existing owned private temporary root on device B
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: isolated-imk-notary
  cancel-in-progress: false
jobs:
  notarize:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Read pinned toolchain
        id: rust
        run: |
          channel="$(sed -n 's/^channel = "\([^" ]*\)"$/\1/p' rust-toolchain.toml)"
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - uses: taiki-e/install-action@5d880190e41a7608c29a5c91c6b5d24561d53850
        with:
          tool: cargo-deny
      - name: Verify and build owned test host
        env:
          TARGET_TEST_ROOT: ${{ inputs.target_root }}
        run: |
          make verify
          PYTHONDONTWRITEBYTECODE=1 python3 platforms/macos/tests/test-isolated-imk.py
          PYTHONDONTWRITEBYTECODE=1 python3 packaging/macos/tests/test-isolated-ci.py
          python3 packaging/macos/prepare-isolated-ci.py
          make verify-no-network
      - name: Sign and notarize test host
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_P12_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
          ASC_API_KEY_P8: ${{ secrets.APPLE_ASC_API_KEY }}
          ASC_API_KEY_ID: ${{ secrets.APPLE_ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
        run: bash packaging/macos/ci-sign.sh
      - name: Package notarized test host
        run: |
          ditto -c -k --keepParent platforms/macos/build/Lampyris.app packaging/out/isolated-imk/LampyrisIMKTest.zip
          cd packaging/out/isolated-imk
          shasum -a 256 LampyrisIMKTest.zip > LampyrisIMKTest.zip.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Lampyris-isolated-imk-${{ github.sha }}
          path: packaging/out/isolated-imk/*
          if-no-files-found: error
          retention-days: 7
      - name: Remove signing material
        if: always()
        run: bash packaging/macos/ci-sign.sh --cleanup
