name: Isolated IMK Notarization
on:
  workflow_dispatch:
    inputs:
      target_root:
        description: Existing owned private temp root on the receiving device (under its system temp dir)
        required: true
        type: string
      arch:
        description: Payload architecture (arm64, x86_64 or universal); cross-built on the arm64 runner
        required: true
        default: arm64
        type: choice
        options:
          - arm64
          - x86_64
          - universal
permissions:
  contents: read
concurrency:
  group: isolated-imk-notary
  cancel-in-progress: false
jobs:
  notarize:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Read pinned toolchain
        id: rust
        run: |
          channel="$(sed -n 's/^channel = "\([^" ]*\)"$/\1/p' rust-toolchain.toml)"
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          components: rustfmt, clippy
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - uses: taiki-e/install-action@5d880190e41a7608c29a5c91c6b5d24561d53850
        with:
          tool: cargo-deny
      - name: Verify and build owned test host
        env:
          TARGET_TEST_ROOT: ${{ inputs.target_root }}
          TARGET_ARCH: ${{ inputs.arch }}
        run: |
          make verify
          PYTHONDONTWRITEBYTECODE=1 python3 platforms/macos/tests/test-isolated-imk.py
          PYTHONDONTWRITEBYTECODE=1 python3 packaging/macos/tests/test-isolated-ci.py
          python3 packaging/macos/prepare-isolated-ci.py
          make verify-no-network
      - name: Verify built architecture and binding metadata
        env:
          TARGET_ARCH: ${{ inputs.arch }}
        run: |
          app=platforms/macos/build/Lampyris.app
          cat packaging/out/isolated-imk/TARGET-ROOT.txt packaging/out/isolated-imk/TARGET-ARCH.txt packaging/out/isolated-imk/SOURCE-COMMIT.txt
          case "${TARGET_ARCH}" in
            arm64) expected=arm64 ;;
            x86_64) expected=x86_64 ;;
            universal) expected="arm64 x86_64" ;;
            *) echo "未知架构：${TARGET_ARCH}" >&2; exit 1 ;;
          esac
          actual="$(lipo -archs "${app}/Contents/MacOS/LampyrisIMKTest")"
          [ "$(printf '%s\n' ${expected} | sort | tr '\n' ' ')" = "$(printf '%s\n' ${actual} | sort | tr '\n' ' ')" ] || { echo "架构不符：期望 ${expected}，实际 ${actual}" >&2; exit 1; }
          grep -Fx "requested=${TARGET_ARCH}" packaging/out/isolated-imk/TARGET-ARCH.txt
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "${app}/Contents/Info.plist"
          test "$(cat "${app}/Contents/Resources/IMKTestRoot")" = "$(cat packaging/out/isolated-imk/TARGET-ROOT.txt)"
      - name: Sign and notarize test host
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_P12_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
          ASC_API_KEY_P8: ${{ secrets.APPLE_ASC_API_KEY }}
          ASC_API_KEY_ID: ${{ secrets.APPLE_ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
        run: bash packaging/macos/ci-sign.sh
      - name: Package notarized test host
        run: |
          ditto -c -k --keepParent platforms/macos/build/Lampyris.app packaging/out/isolated-imk/LampyrisIMKTest.zip
          cd packaging/out/isolated-imk
          shasum -a 256 LampyrisIMKTest.zip > LampyrisIMKTest.zip.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Lampyris-isolated-imk-${{ inputs.arch }}-${{ github.sha }}
          path: packaging/out/isolated-imk/*
          if-no-files-found: error
          retention-days: 7
      - name: Remove signing material
        if: always()
        run: bash packaging/macos/ci-sign.sh --cleanup
