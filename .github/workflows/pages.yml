name: Pages

# 初期仅手动触发：仓库仍为 private 时 Pages 不可用，避免 main 出现“红叉”。
# 仓库转公开并在 Settings → Pages 选择 “GitHub Actions” 后，可启用下面的 push 触发（ADR-065）。
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  #   paths: ["site/**", ".github/workflows/pages.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Stamp the published release identity into the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view --repo "$GITHUB_REPOSITORY" --json tagName,assets > release.json
          curl -fsSL "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/appcast.xml" -o appcast.xml
          python3 - <<'PY'
          import json, re, subprocess, sys
          release = json.load(open('release.json'))
          version = release['tagName'].lstrip('v')
          zip_size = next(asset['size'] for asset in release['assets']
                          if asset['name'].endswith('-universal.zip'))
          match = re.search(r'sparkle:version="(\d+)"', open('appcast.xml', encoding='utf-8').read())
          if match is None:
              sys.exit('appcast.xml 里没有 sparkle:version')
          subprocess.run([sys.executable, 'tools/stamp-site.py', '--version', version,
                          '--build', match.group(1), '--size-mb', f'{zip_size / 1_000_000:.1f}',
                          '--out', 'site-out'], check=True)
          PY
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site-out
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
