name: CI

on:
  push:
    branches: [main]
  pull_request:

# 第三方 Actions 固定到审定 commit（见 CONTRIBUTING.md「CI Actions 升级」）；本工作流只读。
permissions:
  contents: read

# 分层 CI（见 docs/开发工作流.md）：
#   check = 快速门禁，任何 PR/推送都跑（内环基准）；
#   macos / fuzz = 重型检查，仅当“代码相关文件”变化时执行；docs-only 时对应 job
#                 仍会成功上报，满足分支保护的必需检查（避免“Expected”卡住）。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # 文档阶段尚无 Cargo workspace：跳过编译类检查，仅做结构校验。
      - name: Detect workspace
        id: ws
        run: |
          if [ -f Cargo.toml ]; then echo "exists=true" >> "$GITHUB_OUTPUT";
          else echo "exists=false" >> "$GITHUB_OUTPUT"; echo "::notice::尚无 Cargo workspace，跳过编译检查"; fi

      - name: Repo structure sanity
        run: |
          set -e
          for f in AGENTS.md HANDOFF.md CONTRIBUTING.md ROADMAP.md Makefile LICENSE \
                   rust-toolchain.toml deny.toml docs/技术方案.md; do
            test -f "$f" || { echo "缺少必需文件: $f"; exit 1; }
          done
          echo "结构校验通过"

      # 工具链由 rust-toolchain.toml 决定（单一真值，避免漂移），此处不硬编码
      - name: Read pinned Rust toolchain
        id: rust
        run: |
          channel="$(sed -n 's/^channel = "\([^" ]*\)"$/\1/p' rust-toolchain.toml)"
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        if: steps.ws.outputs.exists == 'true'
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: steps.ws.outputs.exists == 'true'

      - name: cargo fmt
        if: steps.ws.outputs.exists == 'true'
        run: cargo fmt --all -- --check

      - name: make lint（clippy -D warnings + 零诊断门禁）
        if: steps.ws.outputs.exists == 'true'
        run: make lint

      - name: make test（零诊断门禁）
        if: steps.ws.outputs.exists == 'true'
        run: make test

      - uses: taiki-e/install-action@5d880190e41a7608c29a5c91c6b5d24561d53850 # cargo-deny
        if: steps.ws.outputs.exists == 'true'

      - name: make deny（零诊断门禁）
        if: steps.ws.outputs.exists == 'true'
        run: make deny

      - name: verify no network (privacy assertion)
        run: ./scripts/verify-no-network.sh

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Detect code changes
        id: changes
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: echo "code=$(./scripts/ci-detect-code-changes.sh)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        if: steps.changes.outputs.code == 'true'
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: steps.changes.outputs.code == 'true'
      - name: Install cargo-fuzz
        if: steps.changes.outputs.code == 'true'
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Fuzz the parsers (bounded, short)
        if: steps.changes.outputs.code == 'true'
        run: |
          for target in dict_parser table_parser pinyin_parser; do
            echo "::group::fuzz ${target}"
            cargo +nightly fuzz run "${target}" -- -max_total_time=30
            echo "::endgroup::"
          done

  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Detect code changes
        id: changes
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: echo "code=$(./scripts/ci-detect-code-changes.sh)" >> "$GITHUB_OUTPUT"
      - name: Read pinned Rust toolchain
        id: rust
        if: steps.changes.outputs.code == 'true'
        run: |
          channel="$(sed -n 's/^channel = "\([^" ]*\)"$/\1/p' rust-toolchain.toml)"
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        if: steps.changes.outputs.code == 'true'
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          components: rustfmt, clippy
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: steps.changes.outputs.code == 'true'
      - uses: taiki-e/install-action@5d880190e41a7608c29a5c91c6b5d24561d53850 # cargo-deny
        if: steps.changes.outputs.code == 'true'
      - name: Verify Rust and privacy
        if: steps.changes.outputs.code == 'true'
        run: make verify
      - name: Build universal IMK application (arm64 + x86_64)
        if: steps.changes.outputs.code == 'true'
        run: ./platforms/macos/build.sh --strict --universal
      - name: Reproduce licensed pinyin data
        if: steps.changes.outputs.code == 'true'
        run: |
          ./data/sources/fetch-pinyin-data.sh
          ./data/sources/fetch-phrase-pinyin.sh
          ./data/sources/fetch-jieba-dict.sh
          cargo run -p ime-pinyin --example generate_pinyin
          python3 tools/prepare-pinyin-core.py
          git diff --exit-code -- data/generated/pinyin-chars.tsv data/generated/pinyin-core.tsv data/generated/pinyin-core-report.json
      - name: Build and smoke-test independent preview
        if: steps.changes.outputs.code == 'true'
        run: ./platforms/macos/dev-preview.sh --smoke-test
      - name: Validate app metadata and icons
        if: steps.changes.outputs.code == 'true'
        run: |
          plutil -lint platforms/macos/build/Lampyris.app/Contents/Info.plist
          plutil -lint platforms/macos/build/preview/LampyrisPreview.app/Contents/Info.plist
          cmp assets/icons/yinghuo-official-app.icns platforms/macos/build/Lampyris.app/Contents/Resources/Lampyris.icns
          cmp assets/icons/yinghuo-official-app.icns platforms/macos/build/preview/LampyrisPreview.app/Contents/Resources/Lampyris.icns
      - name: Verify all offline macOS and packaging regressions
        if: steps.changes.outputs.code == 'true'
        run: |
          make macos-offline-tests
      - name: Test isolated website update checker (no live feed)
        if: steps.changes.outputs.code == 'true'
        run: make macos-updater-tests macos-updater-build
      - name: Prepare and reproduce local release candidate
        if: steps.changes.outputs.code == 'true'
        run: |
          ./packaging/macos/prepare.sh
          for archive in packaging/out/candidate-*/*.zip; do
            (cd "$(dirname "$archive")" && shasum -a 256 -c "$(basename "$archive").sha256")
            ./platforms/macos/tests/run-repro.sh "$archive"
          done
      - name: Upload unsigned review archive
        if: steps.changes.outputs.code == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Lampyris-macos-review-${{ github.sha }}
          path: |
            packaging/out/candidate-*/*.zip
            packaging/out/candidate-*/*.zip.sha256
            packaging/out/candidate-*/*-source.tar.gz
            packaging/out/candidate-*/*-source.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
