name: CI

on:
  push:
    branches: [main]
  pull_request:

# 第三方 Actions 固定到审定 commit（见 CONTRIBUTING.md「CI Actions 升级」）；本工作流只读。
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # 文档阶段尚无 Cargo workspace：跳过编译类检查，仅做结构校验。
      - name: Detect workspace
        id: ws
        run: |
          if [ -f Cargo.toml ]; then echo "exists=true" >> "$GITHUB_OUTPUT";
          else echo "exists=false" >> "$GITHUB_OUTPUT"; echo "::notice::尚无 Cargo workspace，跳过编译检查"; fi

      - name: Repo structure sanity
        run: |
          set -e
          for f in AGENTS.md HANDOFF.md CONTRIBUTING.md ROADMAP.md Makefile LICENSE \
                   rust-toolchain.toml deny.toml docs/技术方案.md; do
            test -f "$f" || { echo "缺少必需文件: $f"; exit 1; }
          done
          echo "结构校验通过"

      # 工具链由 rust-toolchain.toml 决定（单一真值，避免漂移），此处不硬编码
      - name: Read pinned Rust toolchain
        id: rust
        run: |
          channel="$(sed -n 's/^channel = "\([^" ]*\)"$/\1/p' rust-toolchain.toml)"
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        if: steps.ws.outputs.exists == 'true'
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: steps.ws.outputs.exists == 'true'

      - name: cargo fmt
        if: steps.ws.outputs.exists == 'true'
        run: cargo fmt --all -- --check

      - name: cargo clippy
        if: steps.ws.outputs.exists == 'true'
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        if: steps.ws.outputs.exists == 'true'
        run: cargo test --workspace

      - uses: taiki-e/install-action@5d880190e41a7608c29a5c91c6b5d24561d53850 # cargo-deny
        if: steps.ws.outputs.exists == 'true'

      - name: cargo deny
        if: steps.ws.outputs.exists == 'true'
        run: cargo deny check

      - name: verify no network (privacy assertion)
        run: ./scripts/verify-no-network.sh

  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Read pinned Rust toolchain
        id: rust
        run: |
          channel="$(sed -n 's/^channel = "\([^" ]*\)"$/\1/p' rust-toolchain.toml)"
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          components: rustfmt, clippy
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: taiki-e/install-action@5d880190e41a7608c29a5c91c6b5d24561d53850 # cargo-deny
      - name: Verify Rust and privacy
        run: make verify
      - name: Build universal IMK application (arm64 + x86_64)
        run: ./platforms/macos/build.sh --strict --universal
      - name: Reproduce licensed pinyin data
        run: |
          ./data/sources/fetch-pinyin-data.sh
          ./data/sources/fetch-phrase-pinyin.sh
          ./data/sources/fetch-jieba-dict.sh
          cargo run -p ime-pinyin --example generate
          python3 tools/prepare-pinyin-core.py
          git diff --exit-code -- data/generated/pinyin-core.tsv data/generated/pinyin-core-report.json
      - name: Build and smoke-test independent preview
        run: ./platforms/macos/dev-preview.sh --smoke-test
      - name: Validate app metadata and icons
        run: |
          plutil -lint platforms/macos/build/Lampyris.app/Contents/Info.plist
          plutil -lint platforms/macos/build/preview/LampyrisPreview.app/Contents/Info.plist
          cmp assets/icons/yinghuo-official-app.icns platforms/macos/build/Lampyris.app/Contents/Resources/Lampyris.icns
          cmp assets/icons/yinghuo-official-app.icns platforms/macos/build/preview/LampyrisPreview.app/Contents/Resources/Lampyris.icns
      - name: Verify signing cleanup without credentials
        run: |
          python3 packaging/macos/tests/test-ci-sign.py
          python3 platforms/macos/tests/test-install.py
      - name: Prepare and reproduce local release candidate
        run: |
          ./packaging/macos/prepare.sh
          for archive in packaging/out/candidate-*/*.zip; do
            (cd "$(dirname "$archive")" && shasum -a 256 -c "$(basename "$archive").sha256")
            ./platforms/macos/tests/run-repro.sh "$archive"
          done
      - name: Upload unsigned review archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Lampyris-macos-review-${{ github.sha }}
          path: |
            packaging/out/candidate-*/*.zip
            packaging/out/candidate-*/*.zip.sha256
          if-no-files-found: error
          retention-days: 14
