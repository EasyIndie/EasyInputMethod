name: macOS Acceptance Package
on:
  push:
    branches: [main]
  workflow_dispatch:
# 第三方 Actions 固定到审定 commit（见 CONTRIBUTING.md「CI Actions 升级」）；本工作流只读。
permissions:
  contents: read
concurrency:
  group: macos-acceptance-${{ github.ref }}
  cancel-in-progress: false
jobs:
  acceptance:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Read pinned Rust toolchain
        id: rust
        run: |
          channel="$(sed -n 's/^channel = "\([^" ]*\)"$/\1/p' rust-toolchain.toml)"
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          components: rustfmt, clippy
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: taiki-e/install-action@5d880190e41a7608c29a5c91c6b5d24561d53850 # cargo-deny
      - name: Verify and build
        run: |
          make verify
          ./platforms/macos/dev-preview.sh --smoke-test
          ./platforms/macos/build.sh --strict --universal
      - name: Verify all offline macOS and packaging regressions
        run: |
          make macos-offline-tests
          python3 platforms/macos/Installer/build.py
      - name: Sign and notarize with team API key
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_P12_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
          ASC_API_KEY_P8: ${{ secrets.APPLE_ASC_API_KEY }}
          ASC_API_KEY_ID: ${{ secrets.APPLE_ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
        run: bash packaging/macos/ci-sign.sh
      - name: Prepare and reproduce acceptance archive
        run: |
          ./packaging/macos/prepare.sh --signed
          for archive in packaging/out/candidate-*/*.zip; do
            (cd "$(dirname "$archive")" && shasum -a 256 -c "$(basename "$archive").sha256")
            ./platforms/macos/tests/run-repro.sh "$archive"
          done
      - name: Upload acceptance archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Lampyris-macos-acceptance-${{ github.sha }}
          path: |
            packaging/out/candidate-*/*.zip
            packaging/out/candidate-*/*.zip.sha256
            packaging/out/candidate-*/*-source.tar.gz
            packaging/out/candidate-*/*-source.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Remove signing material
        if: always()
        run: bash packaging/macos/ci-sign.sh --cleanup
