name: Release

# 仅由 tag（v*）或手动触发；不随 push 自动发布（ADR-065）。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "已存在的 tag（如 v0.1.0）"
        required: true
      dry_run:
        description: "只演练：下载产物并校验附件，不创建 Release"
        type: boolean
        default: false

# 仅本工作流需要写权限（创建 Release）；其余工作流保持 contents: read。
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    # 需要 macOS 构建更新程序并用同一公钥自校验签名。
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Resolve tag and commit
        id: meta
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          git rev-parse --verify "refs/tags/${tag}" >/dev/null
          sha="$(git rev-list -n1 "${tag}")"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - name: Verify signed tag (待启用)
        run: |
          set -euo pipefail
          tag="${{ steps.meta.outputs.tag }}"
          signers=packaging/git-allowed-signers
          if [ ! -f "$signers" ]; then
            echo "::warning::签名 tag 校验尚未启用（缺少 ${signers}）；提交允许的签名者公钥后自动生效。"
            exit 0
          fi
          git config gpg.format ssh
          git config gpg.ssh.allowedSignersFile "$signers"
          git tag -v "$tag"

      - name: Fetch the signed/notarized acceptance package for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="${{ steps.meta.outputs.sha }}"
          run_id="$(gh run list -w macos-acceptance.yml --commit "${sha}" --status success \
            --limit 1 --json databaseId -q '.[0].databaseId')"
          if [ -z "${run_id}" ] || [ "${run_id}" = "null" ]; then
            echo "未找到提交 ${sha} 的成功验收产物；请先让 main 的 macOS Acceptance 流程成功产出候选包。" >&2
            exit 1
          fi
          gh run download "${run_id}" --dir dist
          find dist -type f | sort

      - name: Validate release assets before dry run or publication
        env:
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.meta.outputs.sha }}
        run: |
          python3 packaging/macos/tests/test-validate-release.py
          python3 packaging/macos/validate-release.py dist "$RELEASE_TAG" "$RELEASE_COMMIT" --assets-only > release-assets.txt
          cat release-assets.txt

      - name: Read pinned Rust toolchain
        id: rust
        run: |
          channel="$(sed -n 's/^channel = "\([^" ]*\)"$/\1/p' rust-toolchain.toml)"
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Build updater with the committed public key
        run: python3 platforms/macos/Updater/build.py

      - name: Sign and notarize the updater app
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_P12_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
          ASC_API_KEY_P8: ${{ secrets.APPLE_ASC_API_KEY }}
          ASC_API_KEY_ID: ${{ secrets.APPLE_ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
        run: bash packaging/macos/ci-sign.sh --app platforms/macos/build/website-updater/LampyrisUpdateCheck.app

      - name: Package the updater app as a release asset
        run: |
          set -euo pipefail
          version="$(python3 tools/release_version.py version)"
          mkdir -p packaging/out/release
          name="LampyrisUpdateCheck-${version}.zip"
          ditto -c -k --keepParent platforms/macos/build/website-updater/LampyrisUpdateCheck.app \
            "packaging/out/release/${name}"
          shasum -a 256 "packaging/out/release/${name}" > "packaging/out/release/${name}.sha256"
          printf '%s\n' "packaging/out/release/${name}" "packaging/out/release/${name}.sha256" >> release-assets.txt

      - name: Build and sign the DMG installer
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_P12_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
          ASC_API_KEY_P8: ${{ secrets.APPLE_ASC_API_KEY }}
          ASC_API_KEY_ID: ${{ secrets.APPLE_ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          python3 platforms/macos/Installer/build.py
          installer="platforms/macos/build/installer/LampyrisInstaller.app"
          bash packaging/macos/ci-sign.sh --app "$installer" --sign-only
          app="$(find dist -type d -name Lampyris.app | head -1)"
          test -n "$app"
          version="$(python3 tools/release_version.py version)"
          dmg="packaging/out/release/Lampyris-${version}-universal.dmg"
          bash packaging/macos/make-dmg.sh --app "$app" --installer "$installer" --out "$dmg"
          shasum -a 256 "$dmg" > "$dmg.sha256"
          bash packaging/macos/ci-sign.sh --dmg "$dmg"
          printf '%s\n' "$dmg" "$dmg.sha256" >> release-assets.txt

      - name: Generate signed appcast for the published ZIP
        env:
          UPDATE_PRIVATE_KEY: ${{ secrets.LAMPYRIS_UPDATE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$UPDATE_PRIVATE_KEY"
          tag="${{ steps.meta.outputs.tag }}"
          version="${tag#v}"
          zip="$(grep -E '\.zip$' release-assets.txt | head -1)"
          test -n "$zip" && test -f "$zip"
          build="$(python3 tools/release_version.py build)"
          key="${RUNNER_TEMP}/lampyris-update-key.pem"
          umask 077
          printf '%s' "$UPDATE_PRIVATE_KEY" > "$key"
          trap 'rm -f "$key"' EXIT
          openssl_bin="$(command -v openssl)"
          if brew --prefix openssl@3 >/dev/null 2>&1; then
            openssl_bin="$(brew --prefix openssl@3)/bin/openssl"
          fi
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/$(basename "$zip")"
          OPENSSL_BIN="$openssl_bin" python3 packaging/macos/release-appcast.py \
            --zip "$zip" --build "$build" --short-version "$version" \
            --url "$url" --private-key "$key" --out appcast.xml \
            | tee appcast.json
          python3 -c 'import json; from pathlib import Path; Path("signature.b64").write_text(json.loads(Path("appcast.json").read_text())["signature"])'
          verifier=platforms/macos/build/website-updater/LampyrisUpdateCheck.app/Contents/MacOS/LampyrisUpdateCheck
          "$verifier" --verify-payload "$zip" "$(cat signature.b64)"
          rm -f signature.b64 appcast.json
          printf '%s\n' "appcast.xml" >> release-assets.txt

      - name: Create the GitHub Release (binary + corresponding source, same page)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.meta.outputs.tag }}"
          assets=()
          while IFS= read -r line; do assets+=("$line"); done < release-assets.txt
          printf '%s\n' "${assets[@]}"
          # GPL-3.0 §6(d)：二进制与对应源码必须同页发布。
          printf '%s\n' "${assets[@]}" | grep -q 'source.tar.gz$' \
            || { echo "缺少对应源码包，拒绝发布（GPL §6(d)）" >&2; exit 1; }
          printf '%s\n' "${assets[@]}" | grep -q '\.zip$' \
            || { echo "缺少二进制包。" >&2; exit 1; }
          printf '%s\n' "${assets[@]}" | grep -q 'appcast.xml$' \
            || { echo "缺少更新 appcast。" >&2; exit 1; }
          notes="$(mktemp)"
          cat > "${notes}" <<EOF
          Lampyris ${tag} — 默认离线的五笔/拼音混合输入法（macOS，GPL-3.0-or-later）。

          - **安装（图形界面）**：打开 \`Lampyris-${tag#v}-universal.dmg\`，双击「安装萤火虫」，按提示完成；无需终端。
          - **安装（命令行）**：解压 \`Lampyris-${tag#v}-universal.zip\`，见包内 \`README.md\`；注销后在「系统设置 → 键盘 → 文字输入」添加。
          - **对应源码**（GPL-3.0 §6(d)）：\`Lampyris-${tag#v}-source.tar.gz\`（与本页同一位置）。
          - **校验**：附件 \`.sha256\`。
          - **更新源**：\`appcast.xml\`（Ed25519 签名，客户端默认从本页 latest 获取）。
          - **兼容**：universal（arm64 + x86_64），支持 macOS 13+；仅已记录环境经验证。
          EOF
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "dry_run：附件已就绪，跳过创建 Release："
            printf '%s\n' "${assets[@]}"
            exit 0
          fi
          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" "${assets[@]}" --clobber
          else
            gh release create "${tag}" "${assets[@]}" \
              --title "Lampyris ${tag}" --notes-file "${notes}"
          fi
