[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.98"
description = "萤火虫输入法：跨平台、离线、只做核心输入的中文输入法"

[workspace.dependencies]
ime-core = { path = "crates/ime-core" }
ime-pinyin = { path = "crates/ime-pinyin" }
ime-table = { path = "crates/ime-table" }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"
